workflows:
  ios-release:
    name: NL VIP Team - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      # This name MUST match the App Store Connect integration configured in
      # Codemagic → Team/Personal Settings → Integrations. Renaming it here
      # does NOT rename the integration — it breaks the lookup.
      app_store_connect: "NL VIP Club Key"

    environment:
      vars:
        BUNDLE_ID: "com.leonardos.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6759666320"
        # Activa el early-return en rutas API dinámicas (p.ej. cron) para que
        # Next.js no intente prerenderizar handlers que leen request.headers
        # cuando se hace `output: 'export'`.
        STATIC_EXPORT: "true"
      node: v20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build Next.js for mobile
        script: |
          set -e
          rm -rf .next out
          cp next.config.mobile.js next.config.js
          npm run build
          git checkout next.config.js
          ls -la out
          # Fail fast if the static export didn't produce an index.html —
          # otherwise cap sync would ship an empty public/ and the WebView
          # would load a blank screen on TestFlight.
          test -f out/index.html || { echo "BUILD FAILED: out/index.html missing"; exit 1; }

      - name: Sync Capacitor
        script: |
          npx cap sync ios --inline

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set marketing version and build number
        script: |
          cd ios/App
          # Marketing version basada en BUILD_NUMBER de Codemagic.
          # Garantiza que siempre sea única y monótona creciente.
          # Build 73 → 1.34, build 74 → 1.35, etc. Offset elegido para
          # que el primer build después del fix (build 74+) produzca al
          # menos 1.35, ya que App Store rechazó 1.33 y nunca aceptó 1.34
          # debido al script roto anterior.
          MARKETING_OFFSET=39
          NEW_VERSION="1.$((BUILD_NUMBER - MARKETING_OFFSET))"
          agvtool new-marketing-version "$NEW_VERSION"
          echo "Marketing version set to $NEW_VERSION (BUILD_NUMBER=$BUILD_NUMBER)"

          # Build number único (siempre mayor)
          agvtool new-version -all $(($BUILD_NUMBER + 10))

      - name: Fetch signing files
        script: |
          keychain initialize
          # Generar clave privada para el certificado de distribución
          openssl genrsa -out /tmp/cert_key.pem 2048
          # Descargar perfiles y crear certificado automáticamente
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create

      - name: Add signing certificates to keychain
        script: |
          keychain add-certificates

      - name: Build and sign iOS app
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

  android-release:
    name: NL VIP Team - Android Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      android_signing:
        # Debe coincidir con el nombre del keystore subido en Codemagic →
        # Team/Personal Settings → Code signing identities → Android.
        - nlvip_release_keystore
      groups:
        # Variable group con GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (JSON de la
        # cuenta de servicio de Google Play). Se crea en Codemagic →
        # Team/Personal Settings → Environment variables.
        - google_play
      vars:
        PACKAGE_NAME: "com.leonardos.app"
        # Activa el early-return en rutas API dinámicas (p.ej. cron) para que
        # Next.js no intente prerenderizar handlers que leen request.headers
        # cuando se hace `output: 'export'`.
        STATIC_EXPORT: "true"
      node: v20.11.0
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build Next.js for mobile
        script: |
          set -e
          rm -rf .next out
          cp next.config.mobile.js next.config.js
          npm run build
          git checkout next.config.js
          ls -la out
          # Fail fast if the static export didn't produce an index.html —
          # de lo contrario cap sync empaquetaría un public/ vacío y el
          # WebView cargaría una pantalla en blanco.
          test -f out/index.html || { echo "BUILD FAILED: out/index.html missing"; exit 1; }

      - name: Sync Capacitor
        script: |
          npx cap sync android --inline

      - name: Set up Android signing
        script: |
          # Codemagic vuelca las credenciales del keystore configurado en
          # android_signing como CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD /
          # CM_KEY_ALIAS_USERNAME / CM_KEY_ALIAS_PASSWORD. Los traducimos al
          # keystore.properties que espera android/app/build.gradle.
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS_USERNAME
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          EOF

      - name: Build Android App Bundle
        script: |
          cd android
          # versionCode único y monótono creciente basado en el build de
          # Codemagic, igual que la estrategia de marketing version en iOS.
          export ANDROID_VERSION_CODE="$BUILD_NUMBER"
          export ANDROID_VERSION_NAME="1.0.$BUILD_NUMBER"
          chmod +x ./gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
