workflows:
  ios-release:
    name: NL VIP Team - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.nlvipteam.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6759003518"
        STATIC_EXPORT: "true"
      node: v20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build Next.js for mobile
        script: |
          set -e
          rm -rf .next out
          cp next.config.mobile.js next.config.js
          npm run build
          git checkout next.config.js
          ls -la out
          test -f out/index.html || { echo "BUILD FAILED: out/index.html missing"; exit 1; }

      - name: Sync Capacitor
        script: |
          npx cap sync ios --inline

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set marketing version and build number
        script: |
          cd ios/App
          MARKETING_OFFSET=39
          NEW_VERSION="1.$((BUILD_NUMBER - MARKETING_OFFSET))"
          agvtool new-marketing-version "$NEW_VERSION"
          echo "Marketing version set to $NEW_VERSION (BUILD_NUMBER=$BUILD_NUMBER)"
          agvtool new-version -all $(($BUILD_NUMBER + 10))

      - name: Fetch signing files
        script: |
          keychain initialize
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/api_key.p8
          echo "=== Key diagnostics ==="
          echo "Line count: $(wc -l < /tmp/api_key.p8)"
          echo "Char count: $(wc -c < /tmp/api_key.p8)"
          echo "KeyID    : $(printf '%s' "$APP_STORE_CONNECT_KEY_IDENTIFIER" | sed 's/./& /g')"
          echo "IssuerID : $(printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | sed 's/./& /g')"
          openssl pkey -in /tmp/api_key.p8 -noout 2>&1 && echo "openssl: VALID" || echo "openssl: INVALID"
          cat > /tmp/jwt_test.py <<'PYEOF'
          import os, time, urllib.request, urllib.error
          try:
              import jwt
          except ImportError:
              print("PyJWT not available in this interpreter")
              raise SystemExit(0)
          key = open('/tmp/api_key.p8').read()
          kid = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER'].strip()
          iss = os.environ['APP_STORE_CONNECT_ISSUER_ID'].strip()
          now = int(time.time())
          tok = jwt.encode(
              {'iss': iss, 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'},
              key, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})
          if isinstance(tok, bytes):
              tok = tok.decode()
          req = urllib.request.Request(
              'https://api.appstoreconnect.apple.com/v1/apps?limit=1',
              headers={'Authorization': 'Bearer ' + tok})
          try:
              r = urllib.request.urlopen(req)
              print('HTTP', r.status, '-> AUTH OK (credenciales correctas)')
              print(r.read()[:600].decode())
          except urllib.error.HTTPError as e:
              print('HTTP', e.code, '-> AUTH FAILED')
              print(e.read()[:800].decode())
          PYEOF
          echo "=== Raw JWT auth test against /v1/apps (no bundle id involved) ==="
          PY_BIN="$(head -1 "$(command -v app-store-connect)" | sed 's/^#!//' | awk '{print $1}')"
          [ -x "$PY_BIN" ] || PY_BIN=python3
          echo "python: $PY_BIN"
          "$PY_BIN" /tmp/jwt_test.py || true
          echo "=== End diagnostics ==="
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --private-key @file:/tmp/api_key.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --certificate-key @file:/tmp/cert_key.pem \
            --create

      - name: Add signing certificates to keychain
        script: |
          keychain add-certificates

      - name: Build and sign iOS app
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

  android-release:
    name: NL VIP Team - Android Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      # Grupo a crear en Codemagic (Teams → Code signing / Environment
      # variables) con estas 5 variables, todas marcadas "Secure":
      #   ANDROID_KEYSTORE_BASE64      — el .keystore/.jks pasado por
      #                                  `base64 -i mi.keystore | pbcopy`
      #   ANDROID_KEYSTORE_PASSWORD    — contraseña del keystore
      #   ANDROID_KEY_ALIAS            — alias de la clave dentro del keystore
      #   ANDROID_KEY_PASSWORD         — contraseña de esa clave
      #   FIREBASE_GOOGLE_SERVICES_BASE64 — el google-services.json de Firebase
      #                                  (Project settings → tu app Android),
      #                                  pasado también por `base64`
      groups:
        - android_credentials
      vars:
        STATIC_EXPORT: "true"
      node: v20.11.0

    # Sin bloque `triggering`: este workflow NO se dispara solo con cada push.
    # Se lanza a mano desde el dashboard de Codemagic ("Start new build")
    # hasta que las 5 variables de arriba estén configuradas — así no falla
    # en rojo en cada commit mientras tanto.

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build Next.js for mobile
        script: |
          set -e
          rm -rf .next out
          cp next.config.mobile.js next.config.js
          npm run build
          git checkout next.config.js
          ls -la out
          test -f out/index.html || { echo "BUILD FAILED: out/index.html missing"; exit 1; }

      - name: Sync Capacitor
        script: |
          npx cap sync android --inline

      - name: Write Firebase config (google-services.json)
        script: |
          set -e
          if [ -z "$FIREBASE_GOOGLE_SERVICES_BASE64" ]; then
            echo "FALTA FIREBASE_GOOGLE_SERVICES_BASE64 — sin esto la app compila pero las notificaciones push en Android no funcionarán."
          else
            echo "$FIREBASE_GOOGLE_SERVICES_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json escrito ($(wc -c < android/app/google-services.json) bytes)"
          fi

      - name: Write release keystore and signing config
        script: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "FALTA ANDROID_KEYSTORE_BASE64 — la build saldrá SIN FIRMAR (solo sirve para comprobar que compila, no para instalar)."
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "keystore.properties escrito"
          fi

      - name: Set version code and name
        script: |
          set -e
          cd android/app
          sed -i "s/versionCode 1/versionCode $BUILD_NUMBER/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUMBER\"/" build.gradle
          echo "versionCode=$BUILD_NUMBER versionName=1.0.$BUILD_NUMBER"

      - name: Build signed APK and AAB
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
