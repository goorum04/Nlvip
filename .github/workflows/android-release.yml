name: NL VIP Team - Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK (preinstalled on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js for mobile
        run: |
          set -e
          rm -rf .next out
          cp next.config.mobile.js next.config.js
          # Server-only routes (cron jobs, app-version check) use request.headers/
          # request.url, which the static export can't prerender. The mobile app
          # calls the production API directly, so it never needs these bundled.
          mkdir -p /tmp/excluded-routes
          mv app/api/cron /tmp/excluded-routes/cron
          mv app/api/app-version /tmp/excluded-routes/app-version

          set +e
          npm run build
          BUILD_STATUS=$?
          set -e

          git checkout next.config.js
          mv /tmp/excluded-routes/cron app/api/cron
          mv /tmp/excluded-routes/app-version app/api/app-version

          test $BUILD_STATUS -eq 0 || { echo "BUILD FAILED: npm run build exited $BUILD_STATUS"; exit 1; }
          test -f out/index.html || { echo "BUILD FAILED: out/index.html missing"; exit 1; }

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon from resources/icon.png
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor "#030303" \
            --iconBackgroundColorDark "#030303"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nlvip-team-debug-apk
          path: android/app/build/outputs/**/*.apk
          retention-days: 30
